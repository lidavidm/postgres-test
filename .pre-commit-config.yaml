repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
  hooks:
  - id: ruff-check
    name: "ruff check"
    args: ["--extend-select", "I", "--fix"]
  - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--enforce-all"]
  - id: check-case-conflict
  - id: check-executables-have-shebangs
  - id: check-yaml
  - id: detect-private-key
  - id: end-of-file-fixer
    exclude: '\.sln$'
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: '\.(bat|sln)$'
  - id: trailing-whitespace

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: ce4bd7270237e95464b37d808b942f02785192c4  # frozen: v23.1.5
  hooks:
  - id: clang-format
    types_or: [c, c++]

- repo: https://github.com/adbc-drivers/dev
  rev: v0.1.0
  hooks:
  - id: rat
