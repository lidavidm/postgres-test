services:
  pgrust:
    image: malisper/pgrust:v0.4-beta
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpch
    ports:
      - '127.0.0.1:${PGRUST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: [CMD-SHELL, 'psql -U postgres -d tpch -Atc "SELECT 1"']
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  pgdata:
